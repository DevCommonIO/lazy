# ====================
# Prefix
# ====================
unbind C-b
unbind C-a
set -g prefix C-Space
bind C-Space send-prefix

# ====================
# Indexing
# ====================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ====================
# Mouse + copy mode
# ====================
set -g mouse on
setw -g mode-keys vi

# Alt+y → enter copy mode (vi visual-like selection + pbcopy). prefix+[ also works.
# (Esc is left alone so Claude Code / lazygit / fzf get it immediately.)
bind -n M-y copy-mode

# Mouse drag: enter copy mode and keep selection visible until released
bind -T root MouseDrag1Pane \
  if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    'send-keys -M' \
    'copy-mode -M'

# On mouse release: copy selection to macOS clipboard and exit copy mode
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Double-click: select word and copy
bind -T root DoubleClick1Pane \
  select-pane \; copy-mode -M \; send-keys -X select-word \; \
  send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi DoubleClick1Pane \
  send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"

# Triple-click: select line and copy
bind -T root TripleClick1Pane \
  select-pane \; copy-mode -M \; send-keys -X select-line \; \
  send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi TripleClick1Pane \
  send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"

# Keyboard copy (vi-style)
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# Paste from tmux buffer (prefix+p is previous-window, see Windows)
bind ] paste-buffer
bind P choose-buffer

# Scroll into copy mode automatically (stay there until q/Escape)
bind -T root WheelUpPane \
  if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    'send-keys -M' \
    'copy-mode'

# ====================
# Better timings
# ====================
set -s escape-time 0
set -g repeat-time 2000
set -g focus-events on

# ====================
# History
# ====================
set -g history-limit 50000

# ====================
# Terminal / colors
# ====================
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# ====================
# Windows
# ====================
bind c new-window -c "#{pane_current_path}"
bind -n M-c new-window -c "#{pane_current_path}"

# @pane-is-vim is set by smart-splits.nvim
bind -n M-r if -F "#{@pane-is-vim}" 'send-keys M-r' 'command-prompt "rename-window %%"'

bind & confirm-before -p "kill window #W? (y/n)" kill-window
bind n next-window
bind p previous-window
bind w choose-window
bind , command-prompt "rename-window %%"

# Direct window switching with Alt+1..9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ====================
# Panes / splits
# ====================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"

bind x confirm-before -p "kill pane? (y/n)" kill-pane
bind z resize-pane -Z

# Pane navigation with Alt+h/j/k/l — seamless with Neovim splits (smart-splits.nvim).
# In an nvim pane the key goes to nvim, which moves between its splits and hands
# off to tmux at the edge.
bind -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'select-pane -L'
bind -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'select-pane -D'
bind -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'select-pane -U'
bind -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'select-pane -R'

# Resize with Alt+arrows — same keys in nvim splits and tmux panes
bind -n M-Left  if -F "#{@pane-is-vim}" 'send-keys M-Left'  'resize-pane -L 3'
bind -n M-Down  if -F "#{@pane-is-vim}" 'send-keys M-Down'  'resize-pane -D 3'
bind -n M-Up    if -F "#{@pane-is-vim}" 'send-keys M-Up'    'resize-pane -U 3'
bind -n M-Right if -F "#{@pane-is-vim}" 'send-keys M-Right' 'resize-pane -R 3'

# Navigation inside copy mode too
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# Resize panes with prefix + arrows
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5

# ====================
# Sessions
# ====================
bind S choose-session

# sesh: fuzzy-pick / create a project session (tmux sessions, configured, zoxide dirs)
bind f display-popup -E -w 80% -h 70% -T " sesh " "sesh picker --icons --hide-duplicates --preview"
# Jump back to the previous session
bind L run-shell "sesh last"
# Killing a session switches to another one instead of detaching
set -g detach-on-destroy off
bind : command-prompt

# ====================
# Status bar
# ====================
set -g status-position bottom
set -g status-left-length 50
set -g status-right-length 100
set -g status-interval 5

set -g status-left '#[fg=green]#S #[fg=yellow]| #[fg=cyan]#W'
set -g status-right '#[fg=yellow]%Y-%m-%d #[fg=green]%H:%M'

# ====================
# Quality of life
# ====================
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind q display-message "Prefix OK"

set -g set-clipboard on
